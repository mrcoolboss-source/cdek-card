<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Полтэф Герман · СДЭК</title>

  <!-- Open Graph — для красивого превью в мессенджерах -->
  <meta property="og:title" content="Полтэф Герман — коммерческий представитель СДЭК">
  <meta property="og:description" content="Санкт-Петербург, +7(931)105-66-77, g.poltef@cdek.ru. Нажми, чтобы сохранить контакт.">
  <!-- Замени на прямую ссылку на картинку-превью (1200×630px) -->
  <meta property="og:image" content="https://твой-сайт/preview.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://твой-сайт/">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    /* Карточка с паттерном */
    .business-card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.2);
      overflow: hidden;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }
    .business-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 32px 50px -16px rgba(0,0,0,0.25);
    }

    /* Фирменный фон — диагональные полосы СДЭК */
    .business-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        45deg,
        rgba(17, 156, 65, 0.06) 0px,
        rgba(17, 156, 65, 0.06) 2px,
        transparent 2px,
        transparent 12px
      );
      pointer-events: none;
      z-index: 1;
    }

    .brand-stripe {
      height: 8px;
      background: linear-gradient(90deg, #119C41, #44C767);
      position: relative;
      z-index: 2;
    }

    .card-inner {
      padding: 28px 30px 34px;
      position: relative;
      z-index: 2;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .logo-cdek {
      font-weight: 800;
      font-size: 28px;
      color: #1A1E2C;
    }
    .logo-cdek span { color: #119C41; }

    .badge {
      font-size: 11px;
      font-weight: 600;
      color: #4a4e5c;
      background: #f0f3f7;
      padding: 5px 10px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .full-name {
      font-size: 30px;
      font-weight: 800;
      color: #0b1120;
      margin-top: 6px;
      letter-spacing: -0.3px;
    }

    .job-title {
      font-size: 15px;
      font-weight: 600;
      color: #119C41;
      margin-top: 8px;
      margin-bottom: 26px;
      border-left: 3px solid #119C41;
      padding-left: 14px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 6px 0 4px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      color: #1f2937;
    }
    .contact-row i {
      width: 22px;
      color: #119C41;
      font-size: 16px;
      text-align: center;
    }
    .contact-row a {
      color: #1f2937;
      text-decoration: none;
      font-weight: 500;
    }
    .contact-row a:hover {
      color: #119C41;
      text-decoration: underline;
    }
    .phone-label {
      font-weight: 600;
      color: #5b6e8c;
      margin-right: 5px;
      font-size: 13px;
    }

    .soft-divider {
      height: 1px;
      background: #eef2f9;
      margin: 24px 0 14px 0;
    }

    /* Кнопка сохранения контакта */
    .action-row {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .save-btn {
      background: #119C41;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 18px rgba(17,156,65,0.3);
    }
    .save-btn:hover {
      background: #0d8235;
      transform: scale(1.02);
    }
    .save-btn:active {
      transform: scale(0.97);
    }

    .site-link {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
    }
    .site-link a {
      font-size: 12px;
      font-weight: 500;
      color: #81899b;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .site-link a:hover { color: #119C41; }

    @media (max-width: 520px) {
      .card-inner { padding: 22px 20px 26px; }
      .full-name { font-size: 26px; }
      .logo-cdek { font-size: 24px; }
      .save-btn { padding: 12px 22px; font-size: 14px; }
    }

    @media print {
      body { background: white; padding: 0; display: block; }
      .business-card {
        max-width: 92mm; margin: 0 auto;
        box-shadow: none; border: 1px solid #ddd;
        border-radius: 14px;
      }
      .save-btn { display: none; }  /* кнопка не печатается */
    }
  </style>
</head>
<body>
  <div class="business-card">
    <div class="brand-stripe"></div>
    <div class="card-inner">

      <div class="header-row">
        <div class="logo-cdek">СДЭК<span>.</span></div>
        <div class="badge">express доставка</div>
      </div>

      <div class="full-name">Полтэф Герман</div>
      <div class="job-title">Коммерческий представитель СДЭК</div>

      <div class="contact-list">
        <div class="contact-row">
          <i class="fas fa-map-pin"></i>
          <span>г. Санкт-Петербург, пр-т Индустриальный, 19</span>
        </div>
        <div class="contact-row">
          <i class="fas fa-phone-alt"></i>
          <span>
            <span class="phone-label">осн.:</span>
            <a href="tel:+79311056677">+7(931)105-66-77</a>
          </span>
        </div>
        <div class="contact-row">
          <i class="fas fa-mobile-alt"></i>
          <span>
            <span class="phone-label">доп.:</span>
            <a href="tel:+79819539025">+7(981)953-90-25</a>
          </span>
        </div>
        <div class="contact-row">
          <i class="fas fa-envelope"></i>
          <a href="mailto:g.poltef@cdek.ru">g.poltef@cdek.ru</a>
        </div>
      </div>

      <div class="soft-divider"></div>

      <div class="action-row">
        <button id="saveContactBtn" class="save-btn">
          <i class="fas fa-address-card"></i> Сохранить контакт
        </button>
      </div>

      <div class="site-link">
        <a href="https://www.cdek.ru" target="_blank" rel="noopener noreferrer">
          <i class="fas fa-globe"></i> cdek.ru
        </a>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('saveContactBtn').addEventListener('click', function() {
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Полтэф Герман
ORG:СДЭК
TITLE:Коммерческий представитель СДЭК
TEL;TYPE=WORK,VOICE:+7 931 105-66-77
TEL;TYPE=CELL:+7 981 953-90-25
EMAIL;TYPE=WORK:g.poltef@cdek.ru
ADR;TYPE=WORK:;;пр-т Индустриальный, 19;Санкт-Петербург;;;Россия
URL:https://www.cdek.ru
NOTE:Коммерческий представитель СДЭК
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Poltef_German_CDEK.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
