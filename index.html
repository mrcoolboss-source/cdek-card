<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Полтэф Герман Михайлович · СДЭК</title>

  <!-- Запрет кэширования -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta property="og:title" content="Полтэф Герман Михайлович — коммерческий представитель СДЭК">
  <meta property="og:description" content="+7(931)105-66-77, g.poltef@cdek.ru">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #eef2f5;
      --card-bg: #ffffff;
      --text: #1f2937;
      --heading: #0b1120;
      --muted: #5e6472;
      --border: #eef2f9;
      --shadow: rgba(0,0,0,0.2);
      --accent: #119C41;
      --accent-light: #44C767;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1d23;
        --card-bg: #252830;
        --text: #e0e0e0;
        --heading: #ffffff;
        --muted: #a0a4ae;
        --border: #3a3d45;
        --shadow: rgba(0,0,0,0.5);
        --accent: #2ecc71;
        --accent-light: #27ae60;
      }
    }

    body {
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 24px;
      transition: background 0.3s;
    }

    .business-card {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: 0 25px 45px -12px var(--shadow);
      overflow: hidden;
      position: relative;
      transition: background 0.3s, box-shadow 0.3s;
      animation: cardAppear 0.6s ease-out;
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(20px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .business-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(45deg, rgba(17,156,65,0.06) 0px, rgba(17,156,65,0.06) 2px, transparent 2px, transparent 12px);
      pointer-events: none;
      z-index: 1;
    }

    .brand-stripe {
      height: 8px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      position: relative;
      z-index: 2;
    }

    .card-inner {
      padding: 28px 30px 30px;
      position: relative;
      z-index: 2;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .logo-cdek {
      font-weight: 800;
      font-size: 28px;
      color: var(--heading);
      transition: color 0.3s;
    }
    .logo-cdek span { color: var(--accent); }

    .org-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 16px;
      transition: color 0.3s;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--border);
      padding: 5px 10px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      transition: background 0.3s, color 0.3s;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .full-name {
      font-size: 28px;
      font-weight: 800;
      color: var(--heading);
      letter-spacing: -0.3px;
      transition: color 0.3s;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    .status-circle {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .job-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin: 4px 0 20px;
      border-left: 3px solid var(--accent);
      padding-left: 14px;
      transition: color 0.3s, border-color 0.3s;
    }

    .middle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .contact-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text);
      transition: color 0.3s;
    }
    .contact-row i { width: 22px; color: var(--accent); font-size: 16px; text-align: center; }
    .contact-row a { color: var(--text); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .contact-row a:hover { color: var(--accent); text-decoration: underline; }
    .phone-label { font-weight: 600; color: var(--muted); margin-right: 5px; font-size: 13px; }

    .qr-wrapper {
      flex-shrink: 0;
      background: white;
      padding: 6px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-wrapper:hover { transform: scale(1.03); }
    .qr-tooltip {
      position: absolute;
      background: var(--heading);
      color: white;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      transform: translateY(-30px);
    }
    .qr-wrapper:hover .qr-tooltip { opacity: 1; }

    .quick-actions {
      display: flex;
      gap: 12px;
      margin: 16px 0 8px;
      flex-wrap: wrap;
    }

    .action-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--border);
      color: var(--accent);
      font-size: 18px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .action-icon:hover { background: var(--accent); color: white; transform: scale(1.1); }

    .soft-divider { height: 1px; background: var(--border); margin: 18px 0 12px; transition: background 0.3s; }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .save-btn, .share-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 8px 18px rgba(17,156,65,0.25);
      font-family: inherit;
      text-decoration: none;
    }

    .save-btn:hover, .share-btn:hover { background: #0d8235; transform: scale(1.02); }
    .save-btn:active, .share-btn:active { transform: scale(0.97); }

    .share-btn { background: var(--border); color: var(--text); box-shadow: none; }
    .share-btn:hover { background: #d0d5dd; }

    .site-link {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      transition: color 0.3s;
    }
    .site-link a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

    @media (max-width: 520px) {
      .card-inner { padding: 22px 20px 24px; }
      .full-name { font-size: 24px; }
      .logo-cdek { font-size: 24px; }
      .save-btn, .share-btn { padding: 12px 20px; font-size: 14px; }
      .middle-row { flex-direction: column; align-items: flex-start; }
      .qr-wrapper { align-self: center; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="business-card">
    <div class="brand-stripe"></div>
    <div class="card-inner">
      <div class="header-row">
        <div>
          <div class="logo-cdek">СДЭК<span>.</span></div>
          <div class="org-name">ООО «СДЭК»</div>
        </div>
        <div class="badge">express доставка</div>
      </div>

      <div class="name-row">
        <div class="full-name">Полтэф Герман Михайлович</div>
        <div class="status">
          <span class="status-circle"></span> Онлайн
        </div>
      </div>

      <div class="job-title">Коммерческий представитель СДЭК</div>

      <div class="middle-row">
        <div class="contact-list">
          <div class="contact-row">
            <i class="fas fa-map-pin"></i>
            <span>г. Санкт-Петербург, пр-т Индустриальный, 19</span>
          </div>
          <div class="contact-row">
            <i class="fas fa-phone-alt"></i>
            <span><span class="phone-label">осн.:</span><a href="tel:+79311056677" class="contact-link">+7(931)105-66-77</a></span>
          </div>
          <div class="contact-row">
            <i class="fas fa-mobile-alt"></i>
            <span><span class="phone-label">доп.:</span><a href="tel:+79819539025" class="contact-link">+7(981)953-90-25</a></span>
          </div>
          <div class="contact-row">
            <i class="fas fa-envelope"></i>
            <a href="mailto:g.poltef@cdek.ru" class="contact-link">g.poltef@cdek.ru</a>
          </div>
        </div>

        <div class="qr-wrapper" id="qrContainer">
          <div class="qr-tooltip">Наведите камеру</div>
          <div id="qrcode"></div>
        </div>
      </div>

      <div class="quick-actions">
        <a href="tel:+79311056677" class="action-icon" title="Позвонить" target="_blank"><i class="fas fa-phone"></i></a>
        <a href="https://wa.me/79311056677" class="action-icon" title="WhatsApp" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <!-- ВАЖНО: прямая ссылка на твой Telegram (номер) -->
        <a href="https://t.me/+79311056677" class="action-icon" title="Telegram" target="_blank"><i class="fab fa-telegram-plane"></i></a>
      </div>

      <div class="soft-divider"></div>

      <div class="action-row">
        <!-- Кнопка сохранения контакта -->
        <a href="#" id="saveBtn" class="save-btn" style="text-decoration: none;">
          <i class="fas fa-address-card"></i> Сохранить контакт
        </a>
        <button id="shareBtn" class="share-btn">
          <i class="fas fa-share-alt"></i> Поделиться
        </button>
      </div>

      <div class="site-link">
        <a href="https://www.cdek.ru" target="_blank" rel="noopener noreferrer">
          <i class="fas fa-globe"></i> cdek.ru
        </a>
      </div>
    </div>
  </div>

  <script>
    // QR-код
    new QRCode(document.getElementById('qrcode'), {
      text: window.location.href,
      width: 80,
      height: 80,
      colorDark: '#119C41',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L
    });

    // Функция сохранения контакта
    function saveContact() {
      // Прямая ссылка на vCard-файл, лежащий в репозитории
      const vcfUrl = 'Poltef_German_CDEK.vcf';

      if (window.Telegram && Telegram.WebApp) {
        // В Telegram Mini App принудительно открываем в системном браузере
        Telegram.WebApp.openLink(vcfUrl, { try_open_system_browser: true });
      } else {
        // Для других сред — простое скачивание
        window.open(vcfUrl, '_blank');
      }

      // Анимация на кнопке
      const btn = document.getElementById('saveBtn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i> Сохранено!';
      btn.style.background = '#0d8235';
      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.style.background = '';
      }, 2000);
    }

    document.getElementById('saveBtn').addEventListener('click', function(e) {
      e.preventDefault();
      saveContact();
    });

    // Обработчики для быстрых ссылок (иконки) — в Telegram Mini App открываем через openLink
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();

      document.querySelectorAll('.action-icon').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          // Используем openLink без дополнительных опций, чтобы ссылки открывались внутри Telegram, если возможно
          // Но для внешних ссылок (tel, wa.me, t.me) они будут обработаны системой
          Telegram.WebApp.openLink(this.href);
        });
      });
    }

    // Поделиться
    document.getElementById('shareBtn').addEventListener('click', function() {
      if (navigator.share) {
        navigator.share({
          title: 'Полтэф Герман Михайлович – СДЭК',
          text: 'Моя визитка СДЭК',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          const btn = document.getElementById('shareBtn');
          const originalHTML = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-check"></i> Ссылка скопирована';
          setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
        }).catch(() => {
          alert('Поделиться не удалось. Ссылка: ' + window.location.href);
        });
      }
    });
  </script>
</body>
</html>
